[package]
name = "outpost"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Only for restoring SIGPIPE to its default: see the note at the top of main.
libc = "0.2"

# The transcript rules, from the crate that owns them.
#
# ⚠ **Do NOT vendor these.** `human_turns` carries five facts that callers kept
# re-deriving until they were centralised, after re-deriving them caused a real
# bug — including the one this tool's send-receipt depends on: a message typed
# to a working session is stored as a queued `attachment` and never as a `user`
# row. A copy here would drift from the original silently. A pinned git
# dependency can lag, but the lag is visible in Cargo.lock.
reader = { git = "https://github.com/xinutec/memview.git" }

# The fleet's `[lints]` baseline (dev-lint docs/standards.md §7), so clippy is
# no weaker here than anywhere else. Extensions are argued here, per crate.
[lints.rust]
# `deny`, not `forbid`: main resets SIGPIPE through libc, under an
# `#[expect(unsafe_code)]` that carries the reason at the site.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
